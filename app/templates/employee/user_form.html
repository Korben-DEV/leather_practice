{% extends 'base.html' %}{% block title %}Пользователь{% endblock %}{% block content %}<div class="page-heading"><h1>{{ 'Изменить' if user else 'Создать' }} пользователя</h1></div>{% include 'employee/_nav.html' %}<form method="post" class="form-card stack edit-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Имя<input name="name" required maxlength="120" value="{{ request.form.get('name', user.name if user else '') }}"></label><label>Email<input type="email" name="email" required maxlength="255" value="{{ request.form.get('email', user.email if user else '') }}"></label><label>Пароль {{ '(оставьте пустым, чтобы не менять)' if user else '' }}<input type="password" name="password" minlength="8" {% if not user %}required{% endif %}></label><label>Роль<select name="role"><option value="user" {% if request.form.get('role', user.role if user else 'user') == 'user' %}selected{% endif %}>user</option><option value="employee" {% if request.form.get('role', user.role if user else 'user') == 'employee' %}selected{% endif %}>employee</option></select></label><button class="button">Сохранить</button></form>{% endblock %}
