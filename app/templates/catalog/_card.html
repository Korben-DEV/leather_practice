<article class="card product-card"><a href="{{ url_for('main.product_detail', product_id=product.id) }}"><img src="{{ image_url(product.image) }}" alt="{{ product.name }}" loading="lazy"><div class="card-body"><span class="eyebrow">{{ product.category.name }}</span><h3>{{ product.name }}</h3><p>{{ product.short_description }}</p><strong class="price">{{ '%.0f'|format(product.price) }} ₽</strong></div></a></article>
