{% extends 'base.html' %}{% block title %}Пользователи{% endblock %}{% block content %}<div class="page-heading"><h1>Пользователи</h1></div>{% include 'employee/_nav.html' %}<p><a class="button" href="{{ url_for('employee.user_new') }}">Создать пользователя</a></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Имя</th><th>Email</th><th>Роль</th><th></th></tr></thead><tbody>{% for user in users %}<tr><td>{{ user.id }}</td><td>{{ user.name }}</td><td>{{ user.email }}</td><td>{{ user.role }}</td><td><a href="{{ url_for('employee.user_edit', user_id=user.id) }}">Изменить</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
